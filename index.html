<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Mi Plan · Hoy</title>
<style>
:root{
  --bg-outer:#EDEAE1;
  --bg:#FAF7F2;
  --card:#FFFFFF;
  --ink:#2B2A26;
  --ink-soft:#726F66;
  --ink-faint:#A8A399;
  --sage:#6E8B74;
  --sage-dark:#4F6B55;
  --sage-light:#E7EEE7;
  --sand:#EFE8DA;
  --line:#EAE4D8;
  --accent:#C57A4C;
  --accent-light:#F5E7DB;
  --danger:#B5573F;
  --radius:20px;
  --radius-sm:14px;
  --shadow:0 2px 14px rgba(43,42,38,.07), 0 1px 2px rgba(43,42,38,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg-outer);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
#app-shell{
  width:100%;max-width:480px;min-height:100vh;
  background:var(--bg);
  position:relative;
  box-shadow:0 0 40px rgba(0,0,0,.06);
  display:flex;flex-direction:column;
}
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 8px;
}
#topbar .brand{font-size:15px;font-weight:700;letter-spacing:.02em;color:var(--sage-dark);}
#topbar .streak-chip{
  display:flex;align-items:center;gap:6px;background:var(--sage-light);color:var(--sage-dark);
  padding:6px 12px;border-radius:100px;font-size:12.5px;font-weight:600;
}
#screen{flex:1;padding:6px 18px 110px;}
h1,h2,h3,h4,p{margin:0;}
button{font-family:inherit;cursor:pointer;}
.section-label{
  font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-faint);margin:22px 2px 10px;
}
.section-label:first-child{margin-top:4px;}
.card{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px;margin-bottom:14px;
}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);}
.small{font-size:12.5px;}

/* date nav */
.date-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px;}
.date-nav button.arrow{
  width:36px;height:36px;border-radius:50%;border:none;background:var(--sand);
  color:var(--ink);display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.date-nav button.arrow[disabled]{opacity:.35;pointer-events:none;}
.date-nav button.arrow svg{width:16px;height:16px;}
.date-nav button.arrow.next svg{transform:scaleX(-1);}
.date-center{text-align:center;flex:1;}
.date-main{font-size:16px;font-weight:700;text-transform:capitalize;}
.date-today-tag{font-size:11.5px;color:var(--sage-dark);font-weight:600;margin-top:2px;}
.today-pill{
  border:none;background:var(--accent-light);color:var(--accent);font-size:11.5px;font-weight:700;
  padding:4px 10px;border-radius:100px;margin-top:4px;
}

/* hero / meal cards */
.hero{
  border:1.5px solid var(--sage);background:linear-gradient(180deg,var(--sage-light),#fff 70%);
}
.hero .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage-dark);}
.next-card{
  background:var(--sand);box-shadow:none;padding:14px 18px;
  display:flex;align-items:center;justify-content:space-between;
}
.next-card .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);}
.next-card .name{font-size:15px;font-weight:700;margin-top:2px;}
.next-card .time{font-size:12.5px;color:var(--ink-soft);}
.done-hero{text-align:left;}
.done-hero .hero-badge{
  display:inline-block;background:var(--sage);color:#fff;font-size:12.5px;font-weight:700;
  padding:4px 12px;border-radius:100px;margin-bottom:8px;
}

.meal-head{
  display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none;
}
.meal-head::-webkit-details-marker{display:none;}
.meal-time-badge{
  width:52px;flex:0 0 auto;text-align:center;font-size:12px;font-weight:700;color:var(--sage-dark);
  background:var(--sage-light);border-radius:10px;padding:6px 2px;line-height:1.15;
}
.meal-info{flex:1;min-width:0;}
.meal-name{font-size:16.5px;font-weight:700;}
.meal-name .tag-now{
  font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:100px;
  padding:2px 8px;margin-left:7px;vertical-align:middle;text-transform:uppercase;letter-spacing:.04em;
}
.meal-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
.check-circle{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--sage);background:#fff;
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s;
}
.check-circle svg{width:16px;height:16px;}
.check-circle.checked{background:var(--sage);color:#fff;}
.meal-body{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.hero .meal-body{border-top-color:rgba(79,107,85,.18);}
.group-block{margin-bottom:14px;}
.group-block:last-child{margin-bottom:0;}
.group-title{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ink);text-transform:uppercase;}
.group-note{font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-left:6px;text-transform:none;letter-spacing:0;}
select.opt-select{
  width:100%;margin-top:7px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);font-size:13.5px;font-family:inherit;
}
.extra-note{font-size:13px;color:var(--ink-soft);line-height:1.5;margin-top:12px;}
.extra-note b{color:var(--ink);font-weight:700;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:3px;}
.items-list{margin:8px 0 0;padding-left:0;list-style:none;font-size:13.5px;color:var(--ink-soft);}
.items-list li{padding:5px 0 5px 16px;position:relative;line-height:1.4;}
.items-list li::before{content:"–";position:absolute;left:0;color:var(--sage);}
.btn-primary{
  width:100%;margin-top:16px;border:none;background:var(--sage);color:#fff;font-weight:700;font-size:14.5px;
  padding:13px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-primary.is-done{background:var(--sage-light);color:var(--sage-dark);}
.btn-primary svg{width:16px;height:16px;}

details.meal-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:10px;}
details.meal-card[open]{padding-bottom:18px;}

/* progress strip */
.progress-strip{display:flex;align-items:center;gap:12px;margin:4px 2px 6px;}
.progress-bar-track{flex:1;height:8px;background:var(--sand);border-radius:100px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--sage);border-radius:100px;transition:width .25s;}
.progress-strip .pct{font-size:13px;font-weight:700;color:var(--sage-dark);flex:0 0 auto;}

/* generic row toggle (water/supplements/habits) */
.row-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.row-toggle:last-child{border-bottom:none;}
.row-text .t{font-size:14px;font-weight:600;}
.row-text .d{font-size:12px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.switch{width:44px;height:26px;border-radius:100px;background:var(--sand);border:none;position:relative;flex:0 0 auto;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s;}
.switch.on{background:var(--sage);}
.switch.on::after{left:21px;}

.termo-row{display:flex;gap:10px;margin-top:10px;}
.termo{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 4px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;
}
.termo svg{width:20px;height:20px;color:var(--ink-faint);}
.termo .lbl{font-size:11px;font-weight:700;color:var(--ink-soft);}
.termo.filled{background:var(--sage-light);border-color:var(--sage);}
.termo.filled svg{color:var(--sage-dark);}
.termo.filled .lbl{color:var(--sage-dark);}
.water-total{font-size:13px;color:var(--ink-soft);margin-top:10px;}
.water-total b{color:var(--ink);}

.num-input-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
.num-input-row:last-child{border-bottom:none;}
.num-input{width:78px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;text-align:center;font-family:inherit;}

.activity-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.activity-row:last-child{border-bottom:none;}
.activity-row .name{flex:1;font-size:14px;}
.activity-row .name.done{text-decoration:line-through;color:var(--ink-faint);}
.activity-del{background:none;border:none;color:var(--ink-faint);font-size:18px;line-height:1;padding:4px;}
.add-activity-btn{
  margin-top:12px;width:100%;padding:11px;border-radius:12px;border:1.5px dashed var(--sage);
  background:none;color:var(--sage-dark);font-weight:700;font-size:13.5px;
}
.empty-hint{font-size:13px;color:var(--ink-faint);padding:6px 0;}

.mood-row{display:flex;justify-content:space-between;margin-top:10px;gap:6px;}
.mood-btn{
  flex:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-size:22px;padding:10px 0;
}
.mood-btn.sel{border-color:var(--sage);background:var(--sage-light);}
.notes-area{
  width:100%;margin-top:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px;
  font-family:inherit;font-size:13.5px;min-height:80px;resize:vertical;color:var(--ink);background:#fff;
}

/* progreso tab */
.big-pct{font-size:44px;font-weight:800;color:var(--sage-dark);line-height:1;}
.big-pct-sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.week-bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:16px;}
.week-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
.week-bar{width:100%;max-width:26px;background:var(--sand);border-radius:8px 8px 4px 4px;position:relative;min-height:4px;}
.week-bar-fill{position:absolute;bottom:0;left:0;right:0;background:var(--sage);border-radius:8px 8px 4px 4px;transition:height .25s;}
.week-bar-fill.today{background:var(--accent);}
.week-lbl{font-size:10.5px;color:var(--ink-faint);font-weight:700;}
.streak-num{font-size:30px;font-weight:800;color:var(--accent);}
.streak-lbl{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* registro tab */
.reg-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
.reg-row:last-child{border-bottom:none;}
.reg-date{flex:1;min-width:0;}
.reg-date .d{font-size:14.5px;font-weight:700;text-transform:capitalize;}
.reg-date .n{font-size:12px;color:var(--ink-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.reg-pct-badge{
  font-size:12.5px;font-weight:700;color:var(--sage-dark);background:var(--sage-light);
  padding:5px 10px;border-radius:100px;flex:0 0 auto;
}
.reg-mood{font-size:18px;flex:0 0 auto;}
.reset-btn{
  width:100%;margin-top:8px;padding:13px;border-radius:14px;border:1.5px solid var(--danger);
  background:none;color:var(--danger);font-weight:700;font-size:13.5px;
}
.plan-tag-banner{
  background:var(--sage-dark);color:#fff;padding:14px 18px;border-radius:var(--radius);margin-bottom:16px;
}
.plan-tag-banner .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;}
.plan-tag-banner .v{font-size:15px;font-weight:700;margin-top:3px;}
.registro-tag-banner{
  background:var(--accent-light);color:var(--accent);padding:12px 16px;border-radius:var(--radius-sm);
  margin-bottom:14px;font-size:12.5px;font-weight:600;
}

/* plan tab content */
.plan-block p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:10px;}
.macro-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px;}
.macro-cell{background:var(--sage-light);border-radius:12px;padding:10px 6px;text-align:center;}
.macro-cell .n{font-size:16px;font-weight:800;color:var(--sage-dark);}
.macro-cell .l{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.macro-cell .s{font-size:9.5px;color:var(--ink-faint);margin-top:1px;}
details.plan-acc{background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;}
details.plan-acc summary{font-size:14px;font-weight:700;list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
details.plan-acc summary::-webkit-details-marker{display:none;}
details.plan-acc summary::after{content:"+";font-size:20px;color:var(--ink-faint);font-weight:400;}
details.plan-acc[open] summary::after{content:"–";}
.plan-acc .body{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.recipe-item{margin-bottom:12px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
.recipe-item b{color:var(--ink);}
.rec-list{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink-soft);}
.rec-list li{margin-bottom:10px;}
.comp-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
.comp-table td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--ink-soft);}
.comp-table td:first-child{color:var(--ink);font-weight:600;}
.final-phrase{text-align:center;font-style:italic;font-weight:700;color:var(--sage-dark);font-size:14.5px;padding:20px 10px;line-height:1.5;}
.final-phrase .who{display:block;font-style:normal;font-weight:600;font-size:12px;color:var(--ink-faint);margin-top:8px;}

/* tabbar */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(250,247,242,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
#tabbar button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--ink-faint);font-size:11px;font-weight:600;
}
#tabbar button svg{width:22px;height:22px;}
#tabbar button.active{color:var(--sage-dark);}
</style>
</head>
<body>
<div id="app-shell">
  <div id="topbar">
    <div class="brand">Mi Plan</div>
    <div class="streak-chip" id="streakChip"></div>
  </div>
  <main id="screen"></main>
  <nav id="tabbar">
    <button data-tab="hoy" data-action="set-tab"></button>
    <button data-tab="plan" data-action="set-tab"></button>
    <button data-tab="progreso" data-action="set-tab"></button>
    <button data-tab="registro" data-action="set-tab"></button>
  </nav>
</div>

/* =========================================================
   UTILITIES
========================================================= */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function toKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function todayStr(){ return toKey(new Date()); }
function keyToDate(key){ const [y,m,d]=key.split("-").map(Number); return new Date(y,m-1,d); }
function addDaysKey(key,n){ const d=keyToDate(key); d.setDate(d.getDate()+n); return toKey(d); }
function fmtHuman(key){
  const d = keyToDate(key);
  return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
}
function fmtShort(key){
  const d = keyToDate(key);
  return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"});
}
function weekdayLetter(key){
  const d = keyToDate(key);
  const l = d.toLocaleDateString("es-ES",{weekday:"short"});
  return l.replace(".","").slice(0,2);
}
function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function defaultDay(){
  return {
    meals:{
      desayuno:{done:false, sel:{proteina:0, carbohidrato:0, grasas:0}},
      almuerzo:{done:false, sel:{proteina:0, carbohidrato:0, grasas:0}},
      snack:{done:false, sel:{proteina:0}},
      cena:{done:false, sel:{proteina:0, carbohidrato:0, grasas:0}}
    },
    water:[false,false,false],
    supplements:{proteina:false,creatina:false},
    aguacate:false,
    habits:{entreno:false, pasos:"", sueno:""},
    activities:[],
    mood:null,
    notes:""
  };
}
function getDay(key){
  if(!state.days[key]) state.days[key] = defaultDay();
  return state.days[key];
}
function dayExists(key){ return !!state.days[key]; }

function dayItemsDone(day){
  return [
    day.meals.desayuno.done,
    day.meals.almuerzo.done,
    day.meals.snack.done,
    day.meals.cena.done,
    day.water.every(Boolean),
    Object.values(day.supplements).every(Boolean),
    !!day.aguacate
  ];
}
function dayPct(key){
  if(!dayExists(key)) return 0;
  const items = dayItemsDone(getDay(key));
  const done = items.filter(Boolean).length;
  return Math.round(done/items.length*100);
}
function computeStreak(){
  let streak=0;
  let d = (dayExists(todayStr()) && dayPct(todayStr())===100) ? todayStr() : addDaysKey(todayStr(),-1);
  while(dayExists(d) && dayPct(d)===100){ streak++; d = addDaysKey(d,-1); }
  return streak;
}

function getAhoraSiguiente(dateKey){
  const day = getDay(dateKey);
  const pending = MEAL_ORDER.filter(k=>!day.meals[k].done);
  if(pending.length===0) return {allDone:true};
  const nm = nowMinutes();
  const pastDue = pending.filter(k=>timeToMinutes(PLAN.comidas[k].hora)<=nm);
  let ahoraKey, siguienteKey;
  if(pastDue.length>0){
    ahoraKey = pastDue[pastDue.length-1];
    const idx = MEAL_ORDER.indexOf(ahoraKey);
    siguienteKey = pending.find(k=>MEAL_ORDER.indexOf(k)>idx) || pending.find(k=>k!==ahoraKey) || null;
  } else {
    ahoraKey = pending[0];
    siguienteKey = pending[1] || null;
  }
  return {allDone:false, ahoraKey, siguienteKey};
}

/* =========================================================
   RENDER — root
========================================================= */
const screenEl = document.getElementById("screen");
const tabbarEl = document.getElementById("tabbar");
const streakChipEl = document.getElementById("streakChip");

function render(){
  renderTabbar();
  renderStreakChip();
  if(ui.tab==="hoy") renderHoy();
  else if(ui.tab==="plan") renderPlan();
  else if(ui.tab==="progreso") renderProgreso();
  else if(ui.tab==="registro") renderRegistro();
  bindLiveInputs();
}

function renderTabbar(){
  const tabs = [
    {id:"hoy",label:"Hoy",icon:ICONS.hoy},
    {id:"plan",label:"Plan",icon:ICONS.plan},
    {id:"progreso",label:"Progreso",icon:ICONS.progreso},
    {id:"registro",label:"Registro",icon:ICONS.registro}
  ];
  tabbarEl.innerHTML = tabs.map(t=>`
    <button data-action="set-tab" data-tab="${t.id}" class="${ui.tab===t.id?'active':''}">
      ${t.icon}<span>${t.label}</span>
    </button>`).join("");
}

function renderStreakChip(){
  const s = computeStreak();
  streakChipEl.innerHTML = s>0 ? `<span>${s} ${s===1?'día':'días'} de racha</span>` : `<span>Comienza tu racha hoy</span>`;
}

/* =========================================================
   RENDER — HOY
========================================================= */
function renderHoy(){
  const dateKey = ui.selectedDate;
  const isToday = dateKey===todayStr();
  const day = getDay(dateKey);

  let html = dateNavHtml(dateKey, isToday);

  if(isToday){
    const as = getAhoraSiguiente(dateKey);
    html += '<div>';
    if(as.allDone){
      html += `<div class="card hero done-hero">
        <div class="hero-badge">Plan de comidas completo</div>
        <p class="muted small">Revisa hidratación y suplementos más abajo si aún te faltan.</p>
      </div>`;
    } else {
      html += renderMealCard(as.ahoraKey, dateKey, "hero");
      if(as.siguienteKey){
        const m = PLAN.comidas[as.siguienteKey];
        html += `<div class="next-card">
          <div>
            <div class="eyebrow">Siguiente</div>
            <div class="name">${m.label}</div>
          </div>
          <div class="time">${m.horario}</div>
        </div>`;
      }
    }
    html += '</div>';
  }

  html += progressStripHtml(dateKey);

  html += '<div class="section-label">Tu día</div>';
  MEAL_ORDER.forEach(k=>{
    html += renderMealCard(k, dateKey, "list", isToday);
  });

  html += aguacateCardHtml(dateKey, day);
  html += hydrationCardHtml(dateKey, day);
  html += supplementsCardHtml(dateKey, day);
  html += habitsCardHtml(dateKey, day);
  html += activitiesCardHtml(dateKey, day);
  html += checkinCardHtml(dateKey, day);
  html += notesCardHtml(dateKey, day);

  screenEl.innerHTML = html;
}

function dateNavHtml(dateKey, isToday){
  return `<div class="date-nav">
    <button class="arrow prev" data-action="prev-day" aria-label="Día anterior">${ICONS.chevron}</button>
    <div class="date-center">
      <div class="date-main">${fmtHuman(dateKey)}</div>
      ${isToday ? '<div class="date-today-tag">Hoy</div>' : '<button class="today-pill" data-action="go-today">Volver a hoy</button>'}
    </div>
    <button class="arrow next" data-action="next-day" aria-label="Día siguiente" ${dateKey>=todayStr()?'disabled':''}>${ICONS.chevron}</button>
  </div>`;
}

function progressStripHtml(dateKey){
  const pct = dayPct(dateKey);
  return `<div class="progress-strip">
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="pct">${pct}%</div>
  </div>`;
}

function renderMealCard(key, dateKey, mode, isToday){
  const cfg = PLAN.comidas[key];
  const day = getDay(dateKey);
  const m = day.meals[key];
  const done = m.done;

  let badge = "";
  if(mode==="list" && isToday){
    const as = getAhoraSiguiente(dateKey);
    if(!as.allDone && as.ahoraKey===key) badge = '<span class="tag-now">Ahora</span>';
  }

  const head = `<div class="meal-head" ${mode==="list" ? 'data-toggle-open="1"' : ''}>
    <div class="meal-time-badge">${cfg.hora.replace(":","\n:")}</div>
    <div class="meal-info">
      <div class="meal-name">${cfg.label}${badge}</div>
      <div class="meal-sub">${cfg.horario}</div>
    </div>
    <button class="check-circle ${done?'checked':''}" data-action="toggle-meal" data-meal="${key}" data-date="${dateKey}" aria-label="Marcar ${cfg.label}">${ICONS.check}</button>
  </div>`;

  const body = renderMealBody(key, cfg, m, dateKey, done);

  if(mode==="hero"){
    return `<div class="card hero">
      <div class="eyebrow">Ahora</div>
      <div style="height:8px"></div>
      ${head}
      <div class="meal-body">${body}</div>
    </div>`;
  }

  const open = ui.openMeals.has(key) ? "open" : "";
  return `<details class="meal-card" data-meal="${key}" ${open}>
    <summary class="meal-head">
      <div class="meal-time-badge">${cfg.hora.replace(":","\n:")}</div>
      <div class="meal-info">
        <div class="meal-name">${cfg.label}${badge}</div>
        <div class="meal-sub">${cfg.horario}</div>
      </div>
      <button class="check-circle ${done?'checked':''}" data-action="toggle-meal" data-meal="${key}" data-date="${dateKey}" aria-label="Marcar ${cfg.label}">${ICONS.check}</button>
    </summary>
    <div class="meal-body">${body}</div>
  </details>`;
}

function renderMealBody(key, cfg, m, dateKey, done){
  let html = "";
  if(cfg.items){
    html += `<ul class="items-list">${cfg.items.map(i=>`<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
  }
  if(cfg.grupos){
    cfg.grupos.forEach(g=>{
      const selIdx = m.sel[g.key] ?? 0;
      html += `<div class="group-block">
        <span class="group-title">${g.tipo}</span><span class="group-note">${g.nota}</span>
        <select class="opt-select" data-action="select-opt" data-meal="${key}" data-date="${dateKey}" data-group="${g.key}">
          ${g.opciones.map((o,i)=>`<option value="${i}" ${i==selIdx?'selected':''}>${escapeHtml(o)}</option>`).join("")}
        </select>
      </div>`;
    });
  }
  if(cfg.extras){
    cfg.extras.forEach(e=>{
      html += `<div class="extra-note"><b>${e.tipo}</b>${escapeHtml(e.texto)}</div>`;
    });
  }
  html += `<button class="btn-primary ${done?'is-done':''}" data-action="toggle-meal" data-meal="${key}" data-date="${dateKey}"
    ${done?ICONS.check+' Completada':'Marcar como completada'}
  </button>`;
  return html;
}

  return `<div class="card">

      ${labels.map((l,i)=>`
        <button class="termo ${day.water[i]?'filled':''}" data-action="toggle-water" data-date="${dateKey}" data-idx="${i}">
          ${ICONS.drop}<span class="lbl">${l}</span>
        </button>`).join("")}
    </div>
    <div class="water-total"><b>${litros.toFixed(1)} L</b> de ${PLAN.hidratacion.metaLitros} L (${pct}%)</div>
  </div>`;
}

  return `<div class="card">
    <div class="meal-name" style="font-size:15px">Notas del día</div>
    <textarea class="notes-area" id="input-notes" placeholder="Escribe algo sobre tu día (opcional)...">${escapeHtml(day.notes)}</textarea>
  </div>`;
}

function bindLiveInputs(){
  const dateKey = ui.selectedDate;
  const notesEl = document.getElementById("input-notes");
  if(notesEl){
    notesEl.addEventListener("input", ()=>{
      getDay(dateKey).notes = notesEl.value;
      saveState();
    });
  }
  const pasosEl = document.getElementById("input-pasos");
  if(pasosEl){
    pasosEl.addEventListener("input", ()=>{
      getDay(dateKey).habits.pasos = pasosEl.value;
      saveState();
    });
  }
  const suenoEl = document.getElementById("input-sueno");
  if(suenoEl){
    suenoEl.addEventListener("input", ()=>{
      getDay(dateKey).habits.sueno = suenoEl.value;
      saveState();
    });
  }
}

/* =========================================================
   RENDER — PROGRESO
========================================================= */
function renderProgreso(){
  const today = todayStr();
  const pct = dayPct(today);
  const streak = computeStreak();

  let last7 = [];
  for(let i=6;i>=0;i--) last7.push(addDaysKey(today,-i));

  let html = `<div class="section-label">Hoy</div>
  <div class="card">
    <div class="big-pct">${pct}%</div>
    <div class="big-pct-sub">del plan de hoy completado</div>
  </div>`;

  html += `<div class="section-label">Esta semana</div>
  <div class="card">
    <div class="week-bars">
      ${last7.map(k=>{
        const p = dayPct(k);
        const isToday = k===today;
        return `<div class="week-bar-col">
          <div class="week-bar" style="height:100%">
            <div class="week-bar-fill ${isToday?'today':''}" style="height:${Math.max(p,3)}%"></div>
          </div>
          <div class="week-lbl">${weekdayLetter(k)}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;

  html += `<div class="section-label">Constancia</div>
  <div class="card">
    <div class="streak-num">${streak}</div>
    <div class="streak-lbl">${streak===1?'día seguido cumpliendo tu plan':'días seguidos cumpliendo tu plan'}</div>
  </div>`;

  const daysLogged = Object.keys(state.days).filter(k=>dayPct(k)>0).length;
  const avg = daysLogged ? Math.round(Object.keys(state.days).reduce((a,k)=>a+dayPct(k),0)/Object.keys(state.days).length) : 0;
  html += `<div class="stat-grid">
    <div class="card" style="margin-bottom:0"><div class="big-pct" style="font-size:26px">${Object.keys(state.days).length}</div><div class="big-pct-sub">días registrados</div></div>
    <div class="card" style="margin-bottom:0"><div class="big-pct" style="font-size:26px">${avg}%</div><div class="big-pct-sub">promedio histórico</div></div>
  </div>`;

  screenEl.innerHTML = html;
}

/* =========================================================
   RENDER — REGISTRO
========================================================= */
function renderRegistro(){
  const keys = Object.keys(state.days).sort((a,b)=>b.localeCompare(a));
  let html = `<div class="registro-tag-banner">Este es tu registro personal — el plan del nutricionista no cambia y siempre puedes consultarlo en la pestaña Plan.</div>`;

  html += `<div class="section-label">Historial</div>`;
  if(keys.length===0){
    html += `<div class="card"><div class="empty-hint">Aún no tienes días registrados. Empieza marcando tus comidas en la pestaña Hoy.</div></div>`;
  } else {
    html += `<div class="card">`;
    keys.forEach(k=>{
      const day = state.days[k];
      const p = dayPct(k);
      const moods = ["","😞","🙁","😐","🙂","😄"];
      html += `<div class="reg-row" data-action="open-day" data-date="${k}" style="cursor:pointer">
        <div class="reg-date">
          <div class="d">${fmtHuman(k)}</div>
          ${day.notes ? `<div class="n">${escapeHtml(day.notes)}</div>` : ""}
        </div>
        ${day.mood ? `<div class="reg-mood">${moods[day.mood]}</div>` : ""}
        <div class="reg-pct-badge">${p}%</div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="section-label">Datos</div>
  <div class="card">
    <p class="small muted">Toda la información se guarda únicamente en este dispositivo (localStorage). Puedes reiniciar tu registro personal cuando quieras; esto no afecta el plan del nutricionista.</p>
    <button class="reset-btn" data-action="reset-data">Reiniciar todos los datos</button>
  </div>`;

  screenEl.innerHTML = html;
}

   EVENTS

document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;

  if(action==="set-tab"){
    ui.tab = el.dataset.tab;
    render();
    screenEl.scrollTop = 0;
    return;
  }
  if(action==="prev-day"){
    ui.selectedDate = addDaysKey(ui.selectedDate,-1);
    render();
    return;
  }
  if(action==="next-day"){
    if(ui.selectedDate < todayStr()) ui.selectedDate = addDaysKey(ui.selectedDate,1);
    render();
    return;
  }
  if(action==="go-today"){
    ui.selectedDate = todayStr();
    render();
    return;
  }
  if(action==="toggle-meal"){
    e.preventDefault();
    const date = el.dataset.date, meal = el.dataset.meal;
    const day = getDay(date);
    day.meals[meal].done = !day.meals[meal].done;
    saveState();
    render();
    return;
  }
  if(action==="toggle-water"){
    const date = el.dataset.date, idx = +el.dataset.idx;
    const day = getDay(date);
    day.water[idx] = !day.water[idx];
    saveState();
    render();
    return;
  }
  if(action==="toggle-aguacate"){
    const date = el.dataset.date;
    const day = getDay(date);
    day.aguacate = !day.aguacate;
    saveState();
    render();
    return;
  }
  if(action==="toggle-supp"){
    const date = el.dataset.date, supp = el.dataset.supp;
    const day = getDay(date);
    day.supplements[supp] = !day.supplements[supp];
    saveState();
    render();
    return;
  }
  if(action==="toggle-habit-entreno"){
    const date = el.dataset.date;
    const day = getDay(date);
    day.habits.entreno = !day.habits.entreno;
    saveState();
    render();
    return;
  }
  if(action==="add-activity"){
    const date = el.dataset.date;
    const name = window.prompt("Nombre de la actividad:");
    if(name && name.trim()){
      const day = getDay(date);
      day.activities.push({id:Date.now()+"", name:name.trim(), done:false});
      saveState();
      render();
    }
    return;
  }
  if(action==="toggle-activity"){
    const date = el.dataset.date, id = el.dataset.id;
    const day = getDay(date);
    const a = day.activities.find(x=>x.id===id);
    if(a){ a.done = !a.done; saveState(); render(); }
    return;
  }
  if(action==="del-activity"){
    const date = el.dataset.date, id = el.dataset.id;
    const day = getDay(date);
    day.activities = day.activities.filter(x=>x.id!==id);
    saveState();
    render();
    return;
  }
  if(action==="set-mood"){
    const date = el.dataset.date, mood = +el.dataset.mood;
    const day = getDay(date);
    day.mood = (day.mood===mood) ? null : mood;
    saveState();
    render();
    return;
  }
  if(action==="open-day"){
    ui.selectedDate = el.dataset.date;
    ui.tab = "hoy";
    render();
    screenEl.scrollTop = 0;
    return;
  }
  if(action==="reset-data"){
    if(window.confirm("¿Seguro que deseas reiniciar todos tus datos de registro personal? Esta acción no se puede deshacer.")){
      state = {days:{}};
      saveState();
      render();
    }
    return;
  }
});

document.addEventListener("change", (e)=>{
  const el = e.target.closest("[data-action='select-opt']");
  if(!el) return;
  const date = el.dataset.date, meal = el.dataset.meal, group = el.dataset.group;
  const day = getDay(date);
  day.meals[meal].sel[group] = +el.value;
  saveState();
});

screenEl.addEventListener("toggle", (e)=>{
  const details = e.target;
  if(details.matches && details.matches("details.meal-card[data-meal]")){
    const key = details.dataset.meal;
    if(details.open) ui.openMeals.add(key); else ui.openMeals.delete(key);
  }
}, true);

render();
</script>
</body>
</html>
